name: Run backtest

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Backtest request JSON (copy it from the Backtest Lab page)"
        required: true
        default: '{"strategy":"S2","tickers":["SPY","AAPL","MSFT"]}'

concurrency:
  group: data-branch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - run: pip install -r engine/requirements.txt
      - name: Fetch current data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git clone -q --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" out || mkdir -p out
      - name: Run backtest
        working-directory: engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REQUEST: ${{ inputs.request }}
        run: python -m scripts.run_backtest ../out || echo "::warning::Backtest failed; the error is saved for the Lab page"
      - name: Publish to data branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-data.sh out "Backtest $(date -u +%FT%TZ)"
